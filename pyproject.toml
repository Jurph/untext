[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untextre"
version = "0.1.0"
description = "Remove text-based watermarks from images"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jurph" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "easyocr>=1.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "python-doctr>=0.6.0",
    "scikit-image>=0.21.0",
    "simple-lama-inpainting==0.1.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics>=8.0",
]

[project.urls]
Homepage = "https://github.com/Jurph/untext"

[project.scripts]
untextre = "untextre.cli:main"

[project.optional-dependencies]
dev = [
    "codecov-cli>=0.4.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.0",
]
web = [
    "streamlit>=1.28.0",
    "streamlit-drawable-canvas-fix>=0.9.8",
    "streamlit-image-annotation>=0.4.0",
    "streamlit-js-eval>=0.1.5",
]

[tool.setuptools.packages.find]
include = ["untextre*"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".codex-tmp",
    ".uv-cache",
    ".venv",
    "docs",
    "build",
    "experiments",
    "scratch",
    "venv",
]
markers = [
    "slow: marks tests that load ML models, GPU resources, or long-running real-image fixtures (deselect with '-m \"not slow\"')",
    "very_slow: marks heavyweight benchmark-style tests that can run hundreds of generated cases",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".codex-tmp",
    "background",
    "build",
    "docs",
    "experiments",
    "scratch",
    "untextre.egg-info",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_detection.py" = ["E402"]
"tests/test_detector_unit.py" = ["E402"]
"tests/test_discovery.py" = ["E402"]
