version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements_dev.txt" }}
            - pip-v1-
      - run:
          name: Install dependencies
          command: |
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements.txt -r requirements_dev.txt
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements_dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run fast tests
          command: pytest -m "not slow" --tb=short

workflows:
  build-and-test:
    jobs:
      - test
