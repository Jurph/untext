version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    environment:
      UV_CACHE_DIR: .uv-cache
    steps:
      - checkout

      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}-{{ checksum "pyproject.toml" }}
            - uv-v1-

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip uv
            uv sync --extra dev --extra web --frozen

      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}-{{ checksum "pyproject.toml" }}
          paths:
            - .uv-cache
            - .venv

      - run:
          name: Run Ruff
          command: |
            uv run ruff check .

      - run:
          name: Run basedpyright
          command: |
            uv run basedpyright untextre

      - run:
          name: Run tests with coverage
          command: |
            uv run pytest -m "not slow" \
              --cov=untextre \
              --cov-report=xml:coverage.xml \
              --cov-report=term \
              --tb=short \
              --junitxml=test-results/junit.xml

      - run:
          name: Upload coverage to Codecov
          command: |
            uv run codecovcli do-upload \
              --token=$CODECOV_TOKEN \
              --sha=$CIRCLE_SHA1 \
              --git-service=github \
              --slug=Jurph/untext \
              --plugin pycoverage \
              --coverage-files-search-root-folder .

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage.xml

workflows:
  build-and-test:
    jobs:
      - test
