version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout

      - restore_cache:
          keys:
            - venv-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements_dev.txt" }}-{{ checksum "requirements_streamlit.txt" }}
            - venv-v1-

      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            venv/bin/pip install --upgrade pip
            venv/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            venv/bin/pip install -r requirements.txt -r requirements_dev.txt -r requirements_streamlit.txt

      - save_cache:
          key: venv-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements_dev.txt" }}-{{ checksum "requirements_streamlit.txt" }}
          paths:
            - venv

      - run:
          name: Run tests with coverage
          command: |
            source venv/bin/activate
            python -m pytest -m "not slow" \
              --cov=untextre \
              --cov-report=xml:coverage.xml \
              --cov-report=term \
              --tb=short \
              --junitxml=test-results/junit.xml

      - run:
          name: Upload coverage to Codecov
          command: |
            source venv/bin/activate
            codecovcli do-upload \
              --token=$CODECOV_TOKEN \
              --sha=$CIRCLE_SHA1 \
              --git-service=github \
              --slug=Jurph/untext \
              --plugin pycoverage \
              --coverage-files-search-root-folder .

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage.xml

workflows:
  build-and-test:
    jobs:
      - test
